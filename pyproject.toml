[project]
name = "frugal-llm"
version = "0.1.0"
description = "Benchmark latency, throughput and cost of any OpenAI-compatible LLM endpoint."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Leke-Oduoye Erioluwa", email = "lekeoduoyee@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
frugal-llm = "frugal_llm.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
